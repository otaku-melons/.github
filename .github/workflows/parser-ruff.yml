name: Ruff

permissions:
  content: read

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Fetch shared Ruff config
        run: curl -sSfo ruff.toml https://raw.githubusercontent.com/otaku-melons/.github/refs/heads/main/ruff.toml

      - name: Run Ruff
        run: uvx ruff check . --config ruff.toml
        