name: ty

permissions:
  contents: read

on:
  workflow_call:

jobs:
  type-check:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: symlink # Fixes files hardlinking.
    steps:
      - name: Checkout Melon
        uses: actions/checkout@v7
        with:
          repository: otaku-melons/melon

      - name: Checkout parser
        uses: actions/checkout@v7
        with:
          path: parsers/${{ github.event.repository.name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
        
      - name: Set up Melon
        run: uv sync --all-extras --all-groups

      - name: Install parser requirements
        run: |
          if [ -f "parsers/${{ github.event.repository.name }}/requirements.txt" ]; then
            uv pip install -r parsers/${{ github.event.repository.name }}/requirements.txt
          fi
        shell: bash

      - name: Run ty
        run: uv run ty check .
        