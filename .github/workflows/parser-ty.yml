name: ty

permissions:
  content: read

on:
  workflow_call:

jobs:
  type-check:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: symlink # Fixes files hardlinking.
    steps:
      - uses: actions/checkout@v7
        with:
          path: parsers/${{ github.event.repository.name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"
        
      - name: Set up Melon
        run: |
          uv venv
          uv pip install git+https://github.com/otaku-melons/melon --group dev

      - name: Install requirements
        run: |
          if [ -f "parsers/${{ github.event.repository.name }}/requirements.txt" ]; then
            uv pip install -r parsers/${{ github.event.repository.name }}/requirements.txt
          fi
        shell: bash

      - name: Run ty
        run: uv run ty check .
        